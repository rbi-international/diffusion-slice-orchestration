# Matched-resource comparison. Each controller traces a miss-rate versus
# over-reservation frontier by (a) scaling the Eq. (20) target and (b) varying
# the reservation quantile; metrics are interpolated at fixed budgets.
extends: base.yaml
experiment: frontier
output: results/frontier
use_selected: results/validation/selected.yaml
grid:
  workloads: [heavy, extreme]
  capacity: [1.0, 0.82]
  information: [request_observed, proactive]
frontier:
  forecasters: [MovingAverage, QuantileMLP, GAN, DDPM]
  scales: [0.70, 0.775, 0.85, 0.925, 1.0, 1.075, 1.15, 1.225, 1.30, 1.375, 1.45, 1.525, 1.60]
  quantiles: [0.50, 0.60, 0.70, 0.80, 0.86, 0.90, 0.95, 0.98]
  budgets: [30, 40, 50, 60]
