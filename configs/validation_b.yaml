# Study B, section 4: tuning of the RB base shapes on validation seeds.
# Every value below is fixed by docs/PREREGISTRATION_B.md v3.1 (93184d3) and Amendment 1.
extends: base.yaml
experiment: validation_b
output: results/validation_b
use_selected: results/validation/selected.yaml     # study-A training lengths (section 3)
study_b:
  samples: 200                     # M for every generator-based controller (sections 2, 3)
  recal_fit_slots: 80              # recalibration fit on slots 0-79, scored on 80-99 (2.4)
  extra_levels: [0.975, 0.99, 0.995]   # QuantileMLP grid extension (2.2)
  scale_lever: [0.6, 1.8, 21]      # frontier lever for both rules: 21 values (5, Amendment 1)
  rb_c_grid: [0.02, 0.05, 0.1, 0.2, 0.4]   # risk level c tuned per method (Amendment 1, item 2)
  shapes:                          # base shapes b = (eMBB, URLLC, mMTC) (4)
    - [1.0, 1.0, 1.0]
    - [1.0, 0.5, 1.0]
    - [1.0, 0.25, 1.0]
    - [1.0, 0.5, 0.75]
    - [1.0, 0.25, 0.5]
    - [0.75, 0.25, 0.5]
  workloads: [heavy, extreme]
  capacity: [1.0, 0.82]
  budgets: [30, 40, 50]
  validation_seeds: [1, 2, 5, 7, 9]
  test_seeds: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020, 1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029, 1030, 1031, 1032, 1033, 1034, 1035, 1036, 1037, 1038, 1039, 1040, 1041, 1042, 1043, 1044, 1045, 1046, 1047, 1048, 1049, 1050, 1051, 1052, 1053, 1054, 1055, 1056, 1057, 1058, 1059, 1060, 1061, 1062, 1063, 1064, 1065, 1066, 1067, 1068, 1069, 1070, 1071, 1072, 1073, 1074, 1075, 1076, 1077, 1078, 1079, 1080]
